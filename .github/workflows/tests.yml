name: Local app checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install native test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 ffmpeg xvfb xauth imagemagick
      - name: Regression tests and syntax checks
        working-directory: m4a-scribe
        run: |
          /usr/bin/python3 -m unittest discover -s tests -v
          /usr/bin/python3 -m compileall -q scribe scripts tests
          sh -n run-scribe.sh
          sh -n scripts/build-engine.sh
      - name: Exercise GTK widgets and capture layouts
        working-directory: m4a-scribe
        env:
          GSK_RENDERER: cairo
          GTK_A11Y: none
        run: xvfb-run -a -s '-screen 0 1280x900x24' dbus-run-session -- /usr/bin/python3 tests/gtk_smoke.py --screenshots ../artifacts
      - name: Preserve GTK screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gtk-layouts
          path: artifacts/*.png
          if-no-files-found: ignore
          retention-days: 7
