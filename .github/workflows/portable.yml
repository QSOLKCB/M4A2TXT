name: Native portable packages

on:
  pull_request:
    paths: ['m4a-scribe/**', 'm4a2txt', 'scripts/build-portable*', 'scripts/packaging-requirements*', 'scripts/test-portable.py', 'docs/PORTABLE.md', '.github/workflows/portable.yml', 'Formula/**']
  push:
    branches: [main]
    tags: ['v*']
    paths: ['m4a-scribe/**', 'm4a2txt', 'scripts/build-portable*', 'scripts/packaging-requirements*', 'scripts/test-portable.py', 'docs/PORTABLE.md', '.github/workflows/portable.yml', 'Formula/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portable-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Portable ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.12'
          cache: pip
          cache-dependency-path: scripts/packaging-requirements.txt
      - name: Install pinned packaging tools
        run: python -m pip install --require-hashes -r scripts/packaging-requirements.txt
      - name: Install Windows native compiler tools
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: MINGW64
          update: true
          install: git make diffutils mingw-w64-x86_64-gcc
      - name: Record Windows compiler version
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: gcc --version > .native-compiler.txt
      - name: Identify native build inputs
        id: identity
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, os, platform, subprocess
          from pathlib import Path
          values = [platform.platform(), os.environ.get('ImageVersion', '')]
          for command in ([['cmake', '--version'], ['clang', '--version']] if platform.system() == 'Darwin' else [['cmake', '--version']]):
              values.append(subprocess.check_output(command, text=True))
          if platform.system() == 'Windows':
              values.append(Path('.native-compiler.txt').read_text())
          for name in ('scripts/build-portable.py', 'scripts/build-portable-ffmpeg.sh', '.github/workflows/portable.yml'):
              values.append(Path(name).read_text())
          digest = hashlib.sha256('\n'.join(values).encode()).hexdigest()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('key=native-tools-v1-' + digest + '\n')
          PY
      - name: Restore native build products
        id: tools
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            .portable-build/ffmpeg
            .portable-build/whisper-source
            .portable-build/whisper-build
          key: ${{ runner.os }}-${{ runner.arch }}-${{ steps.identity.outputs.key }}
      - name: Build FFmpeg on Windows
        if: runner.os == 'Windows' && steps.tools.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: sh scripts/build-portable-ffmpeg.sh
      - name: Build FFmpeg on macOS
        if: runner.os != 'Windows' && steps.tools.outputs.cache-hit != 'true'
        run: sh scripts/build-portable-ffmpeg.sh
      - name: Build the native application
        shell: bash
        run: |
          ffmpeg=.portable-build/ffmpeg/bin/ffmpeg
          if [ "$RUNNER_OS" = Windows ]; then ffmpeg="$ffmpeg.exe"; fi
          python scripts/build-portable.py --ffmpeg "$ffmpeg"
      - name: Test extracted package and real recognition
        run: python scripts/test-portable.py
      - name: Exercise native desktop controls
        run: python m4a-scribe/tests/portable_smoke.py
      - name: Save native build products after validation
        if: success() && steps.tools.outputs.cache-hit != 'true'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            .portable-build/ffmpeg
            .portable-build/whisper-source
            .portable-build/whisper-build
          key: ${{ runner.os }}-${{ runner.arch }}-${{ steps.identity.outputs.key }}
      - name: Preserve portable download and checksums
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m4a2txt-${{ matrix.os }}
          path: |
            dist/*-portable.zip*
            dist/*-portable.tar.gz*
            dist/portable-validation.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  homebrew:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install formula from this checkout
        run: |
          brew tap-new --no-git qsolkcb/ci
          python3 - <<'PY'
          import os, subprocess
          from pathlib import Path
          formula = Path('Formula/m4a2txt.rb').read_text()
          commit = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          formula = formula.replace('head "https://github.com/QSOLKCB/M4A2TXT.git", branch: "main"',
              f'head "{Path.cwd().as_uri()}", revision: "{commit}"')
          tap = Path(subprocess.check_output(['brew', '--repository', 'qsolkcb/ci'], text=True).strip())
          (tap / 'Formula/m4a2txt.rb').write_text(formula)
          PY
          brew install --HEAD qsolkcb/ci/m4a2txt
          brew test qsolkcb/ci/m4a2txt
