name: CUDA engine checks

on:
  pull_request:
    paths:
      - 'm4a-scribe/scripts/build-engine.sh'
      - '.github/workflows/cuda.yml'
      - 'scripts/cuda-cache-check.py'
  push:
    branches: [main]
    paths:
      - 'm4a-scribe/scripts/build-engine.sh'
      - '.github/workflows/cuda.yml'
      - 'scripts/cuda-cache-check.py'
  workflow_dispatch:
    inputs:
      hardware:
        description: 'Run Mid and High on a registered self-hosted Linux NVIDIA runner (downloads both models)'
        type: boolean
        default: false
      force_cold:
        description: 'Skip engine and compiler caches for a fresh build'
        type: boolean
        default: false
      full_parity:
        description: 'Run fresh/cached canaries and all three clean builds'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cuda-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: CUDA 12.8 build (Ampere and Blackwell)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      SCRIBE_CUDA_ARCHITECTURES: '86;120'
      SCRIBE_BUILD_JOBS: '2'
      SCRIBE_BUILD_ONLY: '1'
      # Keep embedded intermediate filenames stable for byte-exact cache checks.
      # Each source has its own CMake object path; build phases never overlap.
      CUDAFLAGS: '--objdir-as-tempdir'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install NVIDIA toolkit for compilation only
        run: |
          curl --fail --location --proto '=https' --tlsv1.2 \
            https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb \
            --output /tmp/cuda-keyring.deb
          sudo dpkg -i /tmp/cuda-keyring.deb
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cuda-nvcc-12-8 libcublas-dev-12-8 ccache
          echo /usr/local/cuda-12.8/bin >> "$GITHUB_PATH"
      - name: Bind cache identity to the installed toolchain and build configuration
        id: identity
        run: python3 scripts/cuda-cache-check.py prepare
      - name: Restore exact compiler cache
        if: ${{ !inputs.force_cold }}
        id: cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .compiler-cache
          key: ${{ steps.identity.outputs.key }}
      - name: Restore validated linked engine
        if: ${{ !inputs.force_cold && !inputs.full_parity }}
        id: engine
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .engine-cache
          key: ${{ steps.identity.outputs.engine_key }}
      - name: Reuse validated engine or build once (full parity on request)
        env:
          RESTORED: ${{ steps.cache.outputs.cache-hit }}
          FULL_PARITY: ${{ inputs.full_parity }}
        run: |
          mode=build
          if [ "$FULL_PARITY" = true ]; then mode=verify; fi
          if [ "$RESTORED" = true ]; then
            python3 scripts/cuda-cache-check.py "$mode" --restored
          else
            python3 scripts/cuda-cache-check.py "$mode"
          fi
      - name: Confirm CUDA build configuration
        working-directory: m4a-scribe
        run: |
          test -x .runtime/cuda/bin/whisper-cli
          grep '^GGML_CUDA:BOOL=ON$' .runtime/cuda/CMakeCache.txt
          grep '^CMAKE_CUDA_ARCHITECTURES:.*=86;120' .runtime/cuda/CMakeCache.txt
          # This host has link stubs, not libcuda.so.1 from a real driver.
          readelf -d .runtime/cuda/bin/whisper-cli
          nm .runtime/cuda/bin/whisper-cli | grep ' T ggml_backend_cuda_init$'
          echo 'CUDA compilation passed. This hosted runner has not performed GPU inference.'
      - name: Save compiler cache after successful validation
        if: ${{ success() && steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .compiler-cache
          key: ${{ steps.identity.outputs.key }}
      - name: Save validated linked engine
        if: ${{ success() && steps.engine.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .engine-cache
          key: ${{ steps.identity.outputs.engine_key }}
      - name: Preserve timings, parity results and build diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cuda-build-evidence
          path: .cache-evidence/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30

  hardware:
    name: Mid and High CUDA hardware acceptance (manual)
    if: github.event_name == 'workflow_dispatch' && inputs.hardware
    runs-on: [self-hosted, linux, x64, cuda]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check installed NVIDIA prerequisites
        run: |
          nvidia-smi
          nvcc --version
          ffmpeg -version
      - name: Build the local CUDA engine and explicitly install both models
        working-directory: m4a-scribe
        run: |
          sh scripts/build-engine.sh cuda
          python3 scripts/install-model.py large-v3-turbo-q5_0 --download
          python3 scripts/install-model.py large-v3 --download
      - name: Transcribe the public sample with both presets
        working-directory: m4a-scribe
        run: python3 scripts/check-cuda.py --preset mid --preset high --output-dir "$RUNNER_TEMP/m4a2txt-cuda-${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Preserve hardware receipt and public sample transcripts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cuda-hardware-evidence
          path: '${{ runner.temp }}/m4a2txt-cuda-${{ github.run_id }}-${{ github.run_attempt }}/'
          retention-days: 30
